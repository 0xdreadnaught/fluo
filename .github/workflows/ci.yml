name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.23' }
      - run: sudo apt-get update && sudo apt-get install -y libgl1-mesa-dev xorg-dev
      - run: go vet ./...
      - run: go test ./...
